[project]
name = "docprocessor-shared"
version = "0.1.0"
description = "Library code for the Python services: message contracts, settings, Azure clients, logging, telemetry."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "azure-identity==1.17.1",
    "azure-servicebus==7.14.2",
    "azure-storage-blob==12.22.0",
    "aiohttp==3.10.10", # async transport for the Azure SDK's aio clients
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docprocessor_shared"]
