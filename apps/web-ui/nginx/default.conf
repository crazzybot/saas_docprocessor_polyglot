# Serves the built SPA. The browser calls the document service directly, at
# the apiBaseUrl in config.json, so nothing is proxied here, except in the
# Compose stack, which mounts local-api-proxy.conf into /etc/nginx/web-ui.d/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # connect-src: the API host (any HTTPS origin, since it differs per
    # environment) and Entra ID; frame-src: MSAL's silent token renewal;
    # blob: for "Open original", whose tab inherits this policy (and shows a
    # PDF through the browser's viewer, an object).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: blob:; object-src blob:; frame-src https://login.microsoftonline.com; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    include /etc/nginx/web-ui.d/*.conf;

    # Probes; not routed by the Gateway.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names: cache forever. `expires` rather than add_header, so
    # the server-level headers above still apply.
    location /assets/ {
        expires max;
    }

    # Mounted per environment; must never be cached.
    location = /config.json {
        expires epoch;
    }

    location / {
        expires epoch;
        try_files $uri /index.html;
    }
}
