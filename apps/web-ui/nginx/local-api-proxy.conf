# Compose only (docker-compose.yml mounts this into /etc/nginx/web-ui.d/):
# the API on the page's own origin, so the browser needs no CORS.
location /documents {
    proxy_pass http://document-service:8000;
    # Uploads go up to MAX_UPLOAD_SIZE_MB (25), plus multipart overhead.
    client_max_body_size 30m;
}
