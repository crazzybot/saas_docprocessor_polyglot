# ServiceAccount used by both the document-service and worker pods. Federated
# with an Azure AD (Entra ID) application via Azure AD Workload Identity, so
# pods can obtain tokens for Blob Storage / Service Bus / PostgreSQL without
# any secrets stored in Kubernetes. The identity needs these Azure RBAC role
# assignments:
#   * Storage Blob Data Contributor   - on the storage account
#   * Azure Service Bus Data Sender   - on the namespace (document events + worker events)
#   * Azure Service Bus Data Receiver - on the extraction-jobs queue (worker) and
#                                       the extraction-results/document-service
#                                       subscription (document service)
# plus a PostgreSQL role for the identity on the Flexible Server (created
# with pgaadauth_create_principal, see infra/scripts/create-postgres-role.sh).
# The identity needs a federated credential for this service account
# (system:serviceaccount:docprocessor:docprocessor-workload-identity).
# infra/modules/identities creates all of this; KEDA has a separate identity
# (see keda_scaledobject.yaml).
#
# Pods opt in with the `azure.workload.identity/use: "true"` label on the pod
# template (see the Deployments); the label has no effect on the
# ServiceAccount itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docprocessor-workload-identity
  namespace: docprocessor
  labels:
    app.kubernetes.io/name: docprocessor-workload-identity
    app.kubernetes.io/part-of: saas-docprocessor
  annotations:
    # Client ID of the Azure AD application/managed identity federated with
    # this service account's OIDC issuer + subject claim.
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
    # Tenant of that identity; the webhook injects it as AZURE_TENANT_ID.
    # Optional: defaults to the cluster's tenant. (The token audience is
    # api://AzureADTokenExchange and is not set here.)
    azure.workload.identity/tenant-id: "11111111-1111-1111-1111-111111111111"
---
# Least-privilege Role: allow the workload identity to read (not write)
# ConfigMaps in this namespace, e.g. for dynamic config reload tooling.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: docprocessor-configmap-reader
  namespace: docprocessor
  labels:
    app.kubernetes.io/name: docprocessor-configmap-reader
    app.kubernetes.io/part-of: saas-docprocessor
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: docprocessor-configmap-reader-binding
  namespace: docprocessor
  labels:
    app.kubernetes.io/name: docprocessor-configmap-reader-binding
    app.kubernetes.io/part-of: saas-docprocessor
subjects:
  - kind: ServiceAccount
    name: docprocessor-workload-identity
    namespace: docprocessor
roleRef:
  kind: Role
  name: docprocessor-configmap-reader
  apiGroup: rbac.authorization.k8s.io
