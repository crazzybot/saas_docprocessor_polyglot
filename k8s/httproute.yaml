# Routes the document service's /documents API (and the deprecated /upload
# alias) from the HTTPS listener of the public Gateway (gateway.yaml), with
# explicit CORS for the SaaS frontend. Probe endpoints (/healthz, /readyz) are
# deliberately not routed: the kubelet reaches them on the pod directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: document-service
  namespace: docprocessor
  labels:
    app.kubernetes.io/name: document-service-route
    app.kubernetes.io/part-of: saas-docprocessor
spec:
  parentRefs:
    - name: docprocessor
      namespace: docprocessor-gateway
      sectionName: https
  hostnames:
    - api.docprocessor.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /documents
        # Deprecated alias of POST /documents, kept for existing clients.
        - path:
            type: Exact
            value: /upload
      filters:
        # The gateway answers preflight requests itself and adds the
        # Access-Control-* headers to responses.
        - type: CORS
          cors:
            allowOrigins:
              - "https://app.docprocessor.example.com"
            allowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
            allowHeaders: [Authorization, Content-Type, If-Match, X-Tenant-ID, X-Correlation-ID]
            # Let the browser read the ETag (for If-Match) and Location (after upload).
            exposeHeaders: [ETag, Location, X-Correlation-ID]
            allowCredentials: true
            maxAge: 600
      backendRefs:
        - name: document-service
          port: 80
