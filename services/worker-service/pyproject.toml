[project]
name = "worker-service"
version = "1.1.0"
description = "Text-extraction worker for the SaaS document processing platform."
requires-python = ">=3.11"
dependencies = [
    "docprocessor-shared",
    "PyMuPDF==1.24.14",
    "python-docx==1.1.2",
    "pytesseract==0.3.13",
    "Pillow==10.4.0",
    "prometheus-client==0.20.0",
]

[project.scripts]
worker-service = "worker_service.main:run"

[tool.uv.sources]
docprocessor-shared = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_service"]
